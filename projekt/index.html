<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

    <script>
        $(function(){
            //Zwinięcie pierwszej planszy
            $("#guzikRozpocznij").on("click", function(){
                $(".contenerGuzikRozpocznij").remove();
                $(".tloOtwierajaceGora").slideUp(1000, function(){
                    $(".tloOtwierajaceGora").remove();
                    $(".tloOtwierajaceDol").remove();
                });
                $(".tloOtwierajaceDol").animate({height: "0px"}, 1000);
            })

            //Zwinięcie drugiej planszy i rozpoczęcie gry z człowiekeim
            $("#guzikCzlowiek").on("click", function(){
                $("#wyborPrzeciwnikaH1").remove();
                $("#guzikRobot").remove();
                $("#guzikCzlowiek").remove();

                $(".tloWyboruTrybuLewo").animate({width: "0px"}, 600);
                $(".tloWyboruTrybuPrawo").animate({width: "0px"}, 600, function(){
                    $(".tloWyboruTrybuLewo").remove();
                    $(".tloWyboruTrybuPrawo").remove();
                    let imieO = prompt("Podaj imie gracza O").trim()
                    while(imieO == ""){
                        imieO = prompt("Podaj POPRAWNIE imie gracza O").trim()
                    }
                    $("#imieGraczO").text(imieO)
                    let imieX = prompt("Podaj imie gracza X")
                    while(imieX == ""){
                        imieX = prompt("Podaj POPRAWNIE imie gracza X").trim()
                    }
                    $("#imieGraczX").text(imieX)
                    graZCzlowiekiem();
                });
                
            })
            //Zwinięcie drugiej planszy i rozpoczęcie gry z robotem
            $("#guzikRobot").on("click", function(){
                $("#wyborPrzeciwnikaH1").remove();
                $("#guzikRobot").remove();
                $("#guzikCzlowiek").remove();

                $(".tloWyboruTrybuLewo").animate({width: "0px"}, 600);
                $(".tloWyboruTrybuPrawo").animate({width: "0px"}, 600, function(){
                    $(".tloWyboruTrybuLewo").remove();
                    $(".tloWyboruTrybuPrawo").remove();
                    let imieO = prompt("Podaj imie gracza O").trim()
                    while(imieO == ""){
                        imieO = prompt("Podaj POPRAWNIE imie gracza O").trim()
                    }
                    $("#imieGraczX").text("ROBOCIK")
                    graZRobotem();
                });
                
            })

            $("#czyszczenieTabeli").on("click", function(){
                wygraneO = 0;
                wygraneX = 0;

                $("#wynikGraczKolko").text(wygraneO)
                $("#wynikGraczKrzyzyk").text(wygraneX)
            })

            $("#nowaGra").on("click", function(){
                for(let i = 0; i < 9; i++){
                    plansza[i] = i + 1
                }
                $("#pole0").text("").removeClass("wygranePole")
                $("#pole1").text("").removeClass("wygranePole")
                $("#pole2").text("").removeClass("wygranePole")

                $("#pole3").text("").removeClass("wygranePole")
                $("#pole4").text("").removeClass("wygranePole")
                $("#pole5").text("").removeClass("wygranePole")

                $("#pole6").text("").removeClass("wygranePole")
                $("#pole7").text("").removeClass("wygranePole")
                $("#pole8").text("").removeClass("wygranePole")

                $("#wyswietlaczKogoTura").text("")
                $("#wyswietlaczKogoTura").append('<img src="'+ kolejGracza +'.png" width="200px" height="200px">')
            })

        });

        //robie tak bo inaczej "o" odrazu wygrywa
        let plansza = ["1","2","3","4","5","6","7","8","9"]
        let kolejGracza = "o"

        let wygraneO = 0
        let wygraneX = 0

        
        

        function graZCzlowiekiem(){

            $("#wyswietlaczKogoTura").text("")
            $("#wyswietlaczKogoTura").append('<img src="'+ kolejGracza +'.png" width="200px" height="200px">')

            for(let i = 0; i < 9; i++){
                $("#pole" + i).on("click", function(){
                if(plansza[i] == i + 1){
                    console.log(plansza[i])
                    plansza[i] = kolejGracza
                    $(this).append('<img src="'+ kolejGracza +'.png" width="200px" height="200px">')
              
                    czyWygral()

                    if(kolejGracza == "o"){
                        kolejGracza = "x"
                    }else{
                        kolejGracza = "o"
                    }
                    graZCzlowiekiem()
                }
                })
            }
           
        }


        function graZRobotem(){
            $("#info").text("Kiedyś zrobie by to działało")
        }

        function czyWygral(){
            // Wygrana w wierszach
            if(plansza[0] == plansza[1] && plansza[1] == plansza[2]){
                
                $("#pole0").addClass("wygranePole")
                $("#pole1").addClass("wygranePole")
                $("#pole2").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }

                return;
            }
            if(plansza[3] == plansza[4] && plansza[4] == plansza[5]){
                
                $("#pole3").addClass("wygranePole")
                $("#pole4").addClass("wygranePole")
                $("#pole5").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }
                return;
            }
            if(plansza[6] == plansza[7] && plansza[7] == plansza[8]){
                
                $("#pole6").addClass("wygranePole")
                $("#pole7").addClass("wygranePole")
                $("#pole8").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }
                return;
            }

            // Wygrana na ukos
            if(plansza[0] == plansza[4] && plansza[4] == plansza[8]){
                
                $("#pole0").addClass("wygranePole")
                $("#pole4").addClass("wygranePole")
                $("#pole8").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }
                return;
            }
            if(plansza[2] == plansza[4] && plansza[4] == plansza[6]){
                
                $("#pole2").addClass("wygranePole")
                $("#pole4").addClass("wygranePole")
                $("#pole6").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }
                return;
            }

            //Wygrana w kolumnie
            if(plansza[0] == plansza[3] && plansza[3] == plansza[6]){
                
                $("#pole0").addClass("wygranePole")
                $("#pole3").addClass("wygranePole")
                $("#pole6").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }
                return;
            }
            if(plansza[1] == plansza[4] && plansza[4] == plansza[7]){
                
                $("#pole1").addClass("wygranePole")
                $("#pole4").addClass("wygranePole")
                $("#pole7").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }
                return;
            }
            if(plansza[2] == plansza[5] && plansza[5] == plansza[8]){
                
                $("#pole2").addClass("wygranePole")
                $("#pole5").addClass("wygranePole")
                $("#pole8").addClass("wygranePole")
                
                for(let i = 0; i < 9; i++){
                    plansza[i] = "#"
                }
                if(kolejGracza == "o"){
                    wygraneO += 1;
                    $("#wynikGraczKolko").text(wygraneO)
                }else{
                    wygraneX += 1;
                    $("#wynikGraczKrzyzyk").text(wygraneX)
                }
                return;
            }
        }
    </script>
</head>
<body>
            <!-- STARTOWA PIERWSZA SCENA -->
    <div class="tloOtwierajaceGora">
        <h1 id="h1Tytulowe">KÓŁKO I KRZYŻYK</h1>
    </div>
    <div class="contenerGuzikRozpocznij">
        <button class="guzikWybor" id="guzikRozpocznij">ZAGRAJ</button>
    </div>
    <div class="tloOtwierajaceDol"></div>


            <!-- SCENA DRUGA WYBUR TRYBU -->
    <div class="tloWyboruTrybuLewo">
        <h1 id="wyborPrzeciwnikaH1">Z KIM CHCESZ GRAĆ?</h1>
        <button class="guzikWybor" id="guzikRobot">ROBOT</button>
    </div>
    <div class="tloWyboruTrybuPrawo">
        <button class="guzikWybor" id="guzikCzlowiek">CZŁOWIEK</button>
    </div>


            <!-- ZAWARTOŚĆ GRY -->
    <div class="container-fluid">
        <p id="info"></p>
        
        <h1 class="naglowek">KÓŁKO I KRZYŻYK</h1>
        
        <div class="row">
            <div class="col-lg-4">
                    <!-- KTO IDZIE -->
                <div class="ktoIdzieKontener">
                    <h2>TERAZ KOLEJ:</h2>
                    <br>
                    <p id="wyswietlaczKogoTura"></p>
                </div>
            </div>
            <div class="col-lg-4">
                            <!-- PLANSZA -->
                <div class="container plansza">
                    <div class="row">
                        <div class="col-lg-4 planszaBorderPD" id="pole0"></div>
                        <div class="col-lg-4 planszaBorderPD" id="pole1"></div>
                        <div class="col-lg-4 planszaBorderD" id="pole2"></div>
                    </div>
                    <div class="row">
                        <div class="col-lg-4 planszaBorderPD" id="pole3"></div>
                        <div class="col-lg-4 planszaBorderPD" id="pole4"></div>
                        <div class="col-lg-4 planszaBorderD" id="pole5"></div>
                    </div>
                    <div class="row">
                        <div class="col-lg-4 planszaBorderP" id="pole6"></div>
                        <div class="col-lg-4 planszaBorderP" id="pole7"></div>
                        <div class="col-lg-4 pole" id="pole8"></div>
                    </div>
                </div>

                <button class="guzikRezet" id="nowaGra"><h2>NASTĘPNA RUNDA!</h2></button>
            </div>
            <div class="col-lg-4">
                    <!-- TABLICA WYNIKÓW -->
                <div class="wynikiKontener">
                    <h2>TABLICA WYNIKÓW</h2> <br>
                    <h3 class="wyniki"><span id="imieGraczO"></span>: <span id="wynikGraczKolko">0</span></h3>
                        <br>
                    <h3 class="wyniki"><span id="imieGraczX"></span>: <span id="wynikGraczKrzyzyk">0</span></h3>
                </div>
                <button class="guzikRezet" id="czyszczenieTabeli">ZRESETUJ WYNIK</button>
            </div>
        </div>
        
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
